[project]
name = "sesacpythonfinalprj"
version = "0.1.0"
description = "Streamlit data analysis project"
readme = "README.md"
authors = [
    { name = "YOONJEUN", email = "001.t3st@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "koreanize-matplotlib>=0.1.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "setuptools>=83.0.0",
    "streamlit>=1.61.1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
